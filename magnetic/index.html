const members = [
  ['yunah','윤아','스포트라이트 돌파','짧게 가속하며 앞 장애물 하나를 부숴요.'],
  ['minju','민주','달빛 계단','공중 발판을 만들어 한 번 더 뛰어요.'],
  ['moka','모카','고양이 스텝','낮게 미끄러진 뒤 자동으로 튀어 올라요.'],
  ['wonhee','원희','하트 자석','주변 하트를 위아래 경로에서 끌어당겨요.'],
  ['iroha','이로하','비트 스텝','화면에 표시되는 세 박자에 맞춰 점프나 슬라이드를 누르면 보너스를 얻어요.'],
];
const get = id => document.getElementById(id);
const canvas = get('scene');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const sprites = new Map();
let selected = members[0];
let mode = 'ready';
let run;
const playerX = 126;
const floor = 246;
const finish = 14400;
const speed = 240;

function select(member) {
  if (mode === 'playing' || mode === 'paused') return;
  selected = member;
  for (const button of get('actors').children) {
    button.setAttribute('aria-pressed', String(button.dataset.member === selected[0]));
  }
  get('power').textContent = member[2] + ' · ' + member[3];
}

for (const member of members) {
  const [id, name] = member;
  const button = document.createElement('button');
  const sprite = new Image();
  sprite.src = artwork[id];
  sprite.alt = '';
  sprites.set(id, sprite);
  button.dataset.member = id;
  button.append(sprite, name);
  button.addEventListener('click', () => select(member));
  get('actors').append(button);
}
select(selected);

function course() {
  const items = [];
  for (let section = 0; section < 27; section++) {
    const x = 420 + section * 510;
    const kind = section % 5 === 3 ? 'pad' : section % 2 === 0 ? 'box' : 'sign';
    items.push({x, kind});
    for (let i = 0; i < 5; i++) {
      const height = kind === 'box' ? 40 + Math.sin(i * Math.PI / 4) * 65 : 18;
      items.push({x:x - 85 + i * 39, height, kind:'heart'});
    }
  }
  return items;
}

function reset() {
  run = {x:0, height:0, vy:0, jumps:0, hearts:0, energy:0, hp:3, slide:0, hurt:0,
    magnet:0, dash:0, cat:false, time:0, beats:[], platform:0, items:course()};
}
reset();

function start() {
  if (mode === 'playing') {
    mode = 'paused';
    get('start').textContent = '계속 달리기';
    get('notice').textContent = '잠시 쉬는 중';
    return;
  }
  if (mode !== 'paused') reset();
  mode = 'playing';
  get('start').textContent = '일시정지';
  get('notice').textContent = '하트를 모아 특수기를 충전하세요.';
}

function jump(force = 460) {
  run.slide = 0;
  run.cat = false;
  run.vy = force;
  run.jumps++;
}

function input(action) {
  if (mode !== 'playing') return;
  if (action === 'skill') {
    if (run.energy < 8) return;
    run.energy -= 8;
    get('notice').textContent = selected[2] + '!';
    switch (selected[0]) {
      case 'yunah': run.dash = .9; break;
      case 'minju': run.platform = .8; run.jumps = 0; jump(450); break;
      case 'moka': run.cat = true; run.height = 0; run.vy = 0; run.jumps = 0; run.slide = .66; break;
      case 'wonhee': run.magnet = 5; break;
      case 'iroha': run.beats = [1, 2, 3].map(delay => run.time + delay); break;
    }
    return;
  }
  const beat = run.beats.findIndex(time => Math.abs(time - run.time) < .23);
  if (beat >= 0) {
    run.beats.splice(beat, 1);
    run.hearts += 3;
    get('notice').textContent = '비트 성공! 하트 +3';
  }
  if (action === 'jump' && run.jumps < 2) jump();
  if (action === 'slide' && run.height === 0) run.slide = .56;
}

get('start').addEventListener('click', () => {
  start();
  get('start').blur();
});
for (const action of ['jump','slide','skill']) get(action).addEventListener('click', () => input(action));
window.addEventListener('keydown', event => {
  const action = {Space:'jump',ArrowUp:'jump',ArrowDown:'slide',KeyX:'skill'}[event.code];
  if (event.code === 'Escape' && !event.repeat && (mode === 'playing' || mode === 'paused')) start();
  if (!action || mode !== 'playing' || (event.code === 'Space' && event.target instanceof HTMLButtonElement)) return;
  event.preventDefault();
  if (!event.repeat) input(action);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && mode === 'playing') start();
});

function end(won) {
  mode = won ? 'clear' : 'lost';
  get('start').textContent = '다시 달리기';
  get('notice').textContent = won ? '첫 단서 획득! 달빛 아래에서 다음 조각을 찾아요.' : '체력이 모두 떨어졌어요. 다시 도전해요!';
}

function update(dt) {
  const activeDash = run.dash > 0;
  const previousSlide = run.slide;
  const previousX = run.x;
  run.x += dt * speed * (activeDash ? 1.25 : 1);
  run.time += dt;
  for (const timer of ['slide','hurt','magnet','dash','platform']) run[timer] = Math.max(0, run[timer] - dt);
  run.beats = run.beats.filter(time => time > run.time - .23);
  if (run.cat && previousSlide && !run.slide) jump(390);
  if (run.height > 0 || run.vy > 0) {
    run.height += run.vy * dt;
    run.vy -= 1150 * dt;
    if (run.height <= 0) {
      run.height = run.vy = run.jumps = 0;
    }
  }
  for (const item of run.items) {
    const distance = item.x - run.x;
    if (item.done || distance > 125 || distance < -32) continue;
    if (item.kind === 'heart') {
      const center = run.height + (run.slide ? 17 : 40);
      if ((Math.abs(distance) < 23 && Math.abs(item.height - center) < 31) || (run.magnet && distance < 125)) {
        item.done = true;
        run.hearts++;
        run.energy = Math.min(8, run.energy + 1);
      }
    } else if (item.kind === 'pad' && previousX < item.x && run.x >= item.x && run.height < 18) {
      item.done = true;
      run.magnet = Math.max(run.magnet, 2.3);
      get('notice').textContent = '자석 발판! 주변 하트가 끌려와요.';
    } else if (item.kind !== 'pad' && Math.abs(distance) < 21) {
      const bottom = run.height;
      const top = bottom + (run.slide ? 31 : 64);
      const collision = item.kind === 'box' ? bottom < 40 : top > 38 && bottom < 73;
      if (!collision) continue;
      if (run.dash) {
        item.done = true;
        run.dash = 0;
      } else if (!run.hurt) {
        item.done = true;
        run.hp--;
        run.hurt = 1;
        if (!run.hp) { end(false); return; }
      }
    }
  }
  if (run.x >= finish) end(true);
}

function rect(x,y,w,h,color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function draw() {
  const sky = ctx.createLinearGradient(0,0,0,floor);
  sky.addColorStop(0,'#322c59');
  sky.addColorStop(1,'#efacbb');
  rect(0,0,720,300,sky);
  ctx.fillStyle = '#ffedbd';
  ctx.beginPath();
  ctx.arc(558,68,31,0,Math.PI*2);
  ctx.fill();
  for (let i=0;i<13;i++) {
    const offset = (run.x*.16)%74;
    const x = i*74-offset;
    const height = 52+((i+Math.floor(run.x*.16/74))*47)%92;
    rect(x,floor-height,64,height,'#54476e');
    for (let y=floor-height+11;y<floor-8;y+=18) rect(x+13,y,12,7,'#d2a4bf');
  }
  rect(0,floor,720,54,'#35304d');
  rect(0,floor,720,4,'#ffe0ce');
  for (let i=0;i<15;i++) rect(i*52-run.x%52,267,30,3,'#76688b');
  for (const item of run.items) {
    const x = playerX + item.x - run.x;
    if (item.done || x < -35 || x > 755) continue;
    if (item.kind === 'box') {
      rect(x-15,floor-40,30,40,'#924766');
      rect(x-11,floor-35,22,4,'#ffb8c7');
    } else if (item.kind === 'sign') {
      rect(x-14,floor-73,28,35,'#5e396e');
      rect(x-11,floor-69,22,3,'#ffcfe0');
      ctx.fillStyle='#fff4ed'; ctx.font='bold 17px system-ui'; ctx.fillText('↓',x-7,floor-46);
    } else if (item.kind === 'pad') {
      rect(x-19,floor-7,38,7,'#a3fff0');
      rect(x-14,floor-11,28,4,'#4ccbbf');
    } else {
      ctx.font = 'bold 19px system-ui';
      ctx.fillStyle = '#fff0ae';
      ctx.fillText('♥', x-9, floor-item.height+5);
    }
  }
  const goalX = playerX + finish - run.x;
  if (goalX < 750) {
    rect(goalX-2, floor-106, 4,106,'#fff4d6');
    rect(goalX, floor-106,44,30,'#dc6aa5');
    ctx.fillStyle='#fff4ed'; ctx.font='bold 14px system-ui'; ctx.fillText('단서',goalX+7,floor-86);
  }
  const sprite = sprites.get(selected[0]);
  const feet = floor - run.height;
  if (run.platform) rect(playerX-22, feet+6,44,3,'#d4ecff');
  if (run.magnet || run.dash) {
    ctx.strokeStyle = run.magnet ? '#a3fff0' : '#ffd99a';
    ctx.beginPath(); ctx.arc(playerX,feet-34,40,0,Math.PI*2); ctx.stroke();
  }
  if (sprite.complete && sprite.naturalWidth) {
    const height = run.slide ? 31 : 72;
    const width = Math.round(sprite.naturalWidth * 72 / sprite.naturalHeight) + (run.slide ? 11 : 0);
    const gait = mode === 'playing' && !run.height && !run.slide ? Math.sin(run.time*27) : 0;
    ctx.save();
    ctx.translate(playerX, Math.round(feet-Math.abs(gait)*3));
    ctx.rotate(gait*.055);
    if (run.hurt && Math.floor(run.hurt*12)%2) ctx.globalAlpha = .35;
    ctx.drawImage(sprite, -Math.round(width/2), -height, width, height);
    ctx.restore();
  }
  if (run.beats.length) {
    const active = Math.abs(run.beats[0]-run.time) < .23;
    rect(248,21,224,37,active?'#ffd46f':'#3d315b');
    ctx.fillStyle=active?'#251d35':'#fff';
    ctx.font='bold 16px system-ui';
    ctx.textAlign='center'; ctx.fillText(active?'지금! 점프 또는 슬라이드':'♪ 비트 스텝 · 타이밍 준비',360,45); ctx.textAlign='left';
  }
  if (mode === 'clear' || mode === 'lost' || mode === 'paused') {
    rect(210,96,300,73,'#261f41');
    ctx.fillStyle='#fff1d6'; ctx.font='bold 24px system-ui'; ctx.textAlign='center';
    ctx.fillText({clear:'✦ 첫 단서 발견!',lost:'다시 도전!',paused:'일시정지'}[mode],360,141);
    ctx.textAlign='left';
  }
}

let last = 0;
function frame(now) {
  const dt = last ? Math.min((now-last)/1000, .033) : 0;
  last = now;
  if (mode === 'playing') update(dt);
  get('hearts').textContent = '하트 ' + run.hearts;
  get('energy').textContent = '특수기 ' + run.energy + '/8';
  get('life').textContent = '체력 ' + run.hp;
  get('progress').textContent = Math.min(100, Math.floor(run.x/finish*100)) + '%';
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
