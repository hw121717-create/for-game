<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두근두근 사건파일 · Magnetic</title>
<style>
* { box-sizing:border-box }
body { margin:0; min-height:100vh; background:#17162a; color:#fff8ec; font:16px system-ui,sans-serif }
main { max-width:980px; margin:auto; padding:22px clamp(12px,4vw,32px) 28px }
h1 { margin:4px 0 10px; font-size:clamp(26px,5vw,46px); letter-spacing:-.045em }
.tag { color:#ffb8d6; font-size:.75rem; font-weight:800; letter-spacing:.15em }
p { margin:8px 0 14px; color:#e6d6ed }
.actors,.controls { display:flex; flex-wrap:wrap; gap:8px }
button { border:1px solid #81759f; color:inherit; background:#2d2946; border-radius:10px; padding:8px 12px; font:inherit; cursor:pointer; touch-action:manipulation }
button:disabled { opacity:.45; cursor:default }
button:focus-visible { outline:3px solid #ffe1a4; outline-offset:2px }
button[aria-pressed=true],#enter { background:#ffbfdc; color:#2c1933; border-color:#ffbfdc; font-weight:800 }
.actors { margin-top:14px }
.actors button { flex:1; min-width:54px; padding:4px }
.actors img { display:block; margin:auto; height:clamp(76px,14vw,142px); image-rendering:pixelated }
#power { min-height:1.5em; font-size:.9rem }
main:has(#play:not([hidden])) {
  max-width:1440px;
  padding:10px clamp(6px,1.5vw,20px) 16px;
}
main:has(#play:not([hidden])) > .tag { display:none }
.play-header { display:flex; align-items:center; gap:12px; margin-bottom:8px }
.play-header h1 { margin:0; font-size:clamp(16px,3vw,25px) }
.play-header button { flex:none; padding:5px 8px; font-size:.85rem }
.playfield {
  position:relative; container-type:inline-size; margin-inline:auto;
  width:min(100%, max(580px, calc((100dvh - 108px) * 1.64)));
}
.hud {
  position:absolute; inset:2% 1.5% auto; display:flex; gap:.6em;
  align-items:center; font-size:clamp(9px,2cqw,17px);
  font-variant-numeric:tabular-nums; font-weight:750; pointer-events:none;
}
.hud span { white-space:nowrap; padding:.35em .55em; border-radius:.6em; background:#261f41; color:#fff8ec }
.hud span:empty { display:none }
#progress { margin-left:auto }
#notice { margin:5px 0; line-height:1.3 }
.play-actions { display:flex; gap:8px }
.touch-help { display:none }
@media (pointer:coarse) { .touch-help { display:block } }
canvas { width:100%; height:auto; display:block; border:2px solid #8777ac; border-radius:14px; background:#e5bbe4; image-rendering:pixelated; touch-action:none }
.controls { margin-top:12px }
.controls button { flex:1; min-width:76px }
#notice { font-weight:650 }
small { color:#dbc8e7 }
[hidden] { display:none !important }
.story {
  position:absolute; inset:auto 3% 5%; padding:clamp(8px,2cqw,20px);
  background:#261d3df5; border:2px solid #eab4d9; border-radius:12px;
  font-size:clamp(11px,2.5cqw,20px);
}
.story p { margin:4px 0 8px }
.story button { padding:4px 9px; font-size:.85em }
</style>
</head>
<body>
<main>
<div class="tag">ILLIT · 두근두근 사건파일</div>
<section id="selection">
<h1>캐릭터와 스테이지 선택</h1>
<div class="controls" id="stage-list" aria-label="스테이지 선택"></div>
<div id="actors" class="actors" aria-label="캐릭터 선택"></div>
<p id="power"></p>
<p id="skin-name"></p>
<button id="enter">게임 시작 · Enter</button>
</section>
<section id="play" hidden>
<header class="play-header">
<button id="back">캐릭터 선택</button>
<button id="music" aria-pressed="true">BGM 켜짐</button>
<h1 id="stage-title"></h1>
</header>
<div class="playfield">
<canvas id="scene" width="720" height="438" tabindex="-1" aria-label="두근두근 사건파일 자동 달리기 게임"></canvas>
<div class="hud" aria-label="게임 상태"><span id="hearts">하트 0</span><span id="energy">특수기 0/8</span><span id="life">체력 3</span><span id="objective"></span><span id="progress">0%</span></div>
<div id="dialogue" class="story" role="region" aria-label="스토리 대화" hidden>
<strong id="speaker"></strong><p id="line" aria-live="polite"></p>
<button id="advance">계속 · Enter</button>
</div>
</div>
<p id="notice" aria-live="polite"></p>
<div class="play-actions">
<button id="restart" hidden>처음부터</button><button id="next" hidden>다음 스테이지</button><button id="whistle" hidden>호루라기 C</button>
</div>
<small>위 방향키 / Space 점프·이단 점프 · 아래 방향키 슬라이드 · X 특수기 · Esc 일시정지</small>
<small class="touch-help">화면 탭으로 점프 · 아래로 밀어 슬라이드 · 옆으로 밀어 특수기</small>
</section>
</main>

function obstacleKind(kind) {
  return kind === 'flipBox' ? 'box' : kind === 'flipSign' ? 'sign' : kind;
}

const rescueGate = 13400;
const rescueDuration = 2.7;

function rescueWindow() {
  return stage === 5 && run.evidence >= 3 && run.x >= rescueGate && run.x < finish;
}

function lit(ledge) {
  return !ledge.phase || (run.time + ledge.phase) % 2.1 < 1.55;
}

function course() {
  const items = Array.from({length:8}, (_,i) => ({x:155+i*48,height:30,kind:'heart'}));
  for (const [x, kind, high] of stages[stage].obstacles) {
    items.push({x, kind});
    for (let i=0; i<5; i++) {
      const height = obstacleKind(kind) === 'box' ? 40 + Math.sin(i*Math.PI/4) * (high ? 130 : 65) : 18;
      items.push({x:x-85+i*39, height, kind:'heart'});
    }
  }
  if (stage === 0) {
    for (const x of checkpointMarkers) items.push({x,kind:'checkpoint'});
    for (const [x,width] of gaps) {
      items.push({x,width,kind:'gap'});
      for (let i=0;i<6;i++) {
        items.push({x:x-32+i*(width+64)/5,height:33+Math.sin(i*Math.PI/5)*72,kind:'heart'});
      }
    }
    for (const [x,height,width] of bonusLedges) {
      items.push({x,height,width,kind:'ledge'});
      for (const offset of [42,92,142]) items.push({x:x+offset,height:height+35,kind:'bonus'});
    }
    for (const x of sweepPads) {
      items.push({x,kind:'pad'});
      for (let i=0;i<14;i++) {
        items.push({x:x+44+i*28,height:i%2 ? 92 : 45,kind:'heart'});
      }
    }
  }
  if (stage === 1) {
    for (const [x,height,width,phase] of rooftops) {
      items.push({x,height,width,phase,kind:'ledge'});
      for (const offset of [32,70,108]) items.push({x:x+offset,height:height+34,kind:'heart'});
    }
  }
  if (stage === 2) items.push({x:3500,kind:'fork',height:80});
  if (stage === 5) {
    for (const x of [1130,3270,5780,7020,9510,11800]) items.push({x,kind:'evidence',height:45});
  }
  return items.sort((first, second) => first.x - second.x);
}

  if (saved) for (const item of run.items) item.done = item.x <= saved.x;
}

function start() {
  if (mode === 'playing') {
    mode = 'paused';
    get('notice').textContent = '잠시 쉬는 중 · Enter 또는 Esc로 계속';
    return;
  }
  const resumeCheckpoint = mode === 'lost' && checkpoint;
  if (mode !== 'paused') {
    if (!resumeCheckpoint) checkpoint = null;
    reset(resumeCheckpoint || null);
  }
  get('restart').hidden = true;
  mode = 'playing';
  get('next').hidden = true;
  get('notice').textContent = '';
  get('whistle').hidden = stage !== 5;
}

function jump(force = 460) {
  run.standing = null;
  run.slide = 0;
  run.cat = false;
  run.vy = force;
  run.jumps++;
}

function input(action) {
  if (mode !== 'playing') return;
  if (action === 'whistle') {
    if (rescueWindow()) {
      rescueTime = 0;
      mode = 'rescue';
      get('whistle').hidden = true;
      if (musicEnabled && audioContext?.state === 'running') {
        const now = audioContext.currentTime;
        musicNote(90,'sine',now+.015,.13,.42);
        musicNote(95,'sine',now+.16,.22,.45);
      }
    }
    return;
  }
  if (stage === 3 && (action === 'jump' || action === 'slide')) {
    const cue = run.items.find(item => !item.done && !item.danced
      && obstacleKind(item.kind) === (action === 'jump' ? 'box' : 'sign')
      && Math.abs(item.x-run.x-(action === 'jump' ? 62 : 37)) < 25);
    if (cue) {
      cue.danced = true;
      run.combo++;
      run.bestCombo = Math.max(run.bestCombo, run.combo);
      run.hearts += 2;
    }
  }
  if (action === 'skill') {
    if (run.energy < 8) return;
    run.energy -= 8;
    switch (selected[0]) {
      case 'yunah': run.dash = .9; break;
      case 'minju': run.platform = .8; run.jumps = 0; jump(450); break;
      case 'moka': run.standing = null; run.cat = true; run.height = 0; run.vy = 0; run.jumps = 0; run.slide = .66; break;
      case 'wonhee': run.magnet = 5; break;
      case 'iroha': run.beats = [1, 2, 3].map(delay => run.time + delay); break;
    }
    return;
  }
  const beat = run.beats.findIndex(time => Math.abs(time - run.time) < .23);
  if (beat >= 0) {
    run.beats.splice(beat, 1);
    run.hearts += 3;
  }
  if (action === 'jump' && run.jumps < 2) jump();
  if (action === 'slide' && (run.height === 0 || run.standing)) run.slide = .56;
}

let touchStart = null;
canvas.addEventListener('pointerdown', event => {
  if (event.pointerType !== 'touch' || !event.isPrimary) return;
  touchStart = {x:event.clientX, y:event.clientY};
});
canvas.addEventListener('pointercancel', () => { touchStart = null; });
canvas.addEventListener('pointerup', event => {
  if (!event.isPrimary || !touchStart) return;
  const dx = event.clientX - touchStart.x;
  const dy = event.clientY - touchStart.y;
  touchStart = null;
  if (dialogue || mode === 'rescue') return;
  if (mode === 'paused' || mode === 'lost' || (mode === 'clear' && stage === 5)) {
    start();
    return;
  }
  if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) input('skill');
  else if (dy > 24) input('slide');
  else input('jump');
});
window.addEventListener('keydown', event => {
  if (event.code === 'Enter' || event.code === 'NumpadEnter') {
    const focusedAction = event.target instanceof HTMLButtonElement
      && ['back','restart','next','whistle','music'].includes(event.target.id);
    if (focusedAction) return;
    event.preventDefault();
    if (event.repeat) return;
    if (get('play').hidden) enterPlay();
    else if (dialogue) advanceDialogue();
    else if (mode === 'rescue') return;
    else if (mode === 'clear' && stage < 5) get('next').click();
    else if (mode !== 'playing') {
      start();
      canvas.focus();
    }
    return;
  }
  const action = {Space:'jump',ArrowUp:'jump',ArrowDown:'slide',KeyX:'skill',KeyC:'whistle'}[event.code];
  if (event.code === 'Escape' && !event.repeat && (mode === 'playing' || mode === 'paused')) start();
  if (!action || mode !== 'playing' || (event.code === 'Space' && event.target instanceof HTMLButtonElement)) return;
  event.preventDefault();
  if (!event.repeat) input(action);
});

function end(won) {
  mode = won ? 'clear' : 'lost';

  get('restart').hidden = !canResume;
  if (won && stage < 5) {
    unlocked = Math.max(unlocked,stage+1);
    try { localStorage.setItem('illit-stage-unlocked',String(unlocked)); } catch {}
    stageButtons();

  }
  const messages = ['첫 단서 발견! 옥상 보너스 별 '+run.bonus+'개 · 자정의 옥상이 열렸어요.','달빛 편지를 찾았어요.',
    run.route === 'upper' ? '별빛 답장을 보냈어요.' : '하트 답장을 보냈어요.',
    '댄스홀 단서 발견! 최고 콤보 ' + run.bestCombo, '쇼윈도 뒤에서 모카의 행방을 찾았어요.',
    '구출 성공! 다섯 멤버가 다시 모였어요.'];
  const result = won ? messages[stage] : stage === 5 && run.x >= finish
    ? '유령이 달아났어요. 다시 도전해요.'
    : canResume ? '체크포인트에서 이어 달릴 수 있어요.' : '체력이 모두 떨어졌어요. 다시 도전해요!';
  const nextHint = won && stage < 5 ? '다음 스테이지' : canResume ? '체크포인트부터' : '다시 도전';
  const showResult = () => {
    get('notice').textContent = result + ' · Enter ' + nextHint;
    get('next').hidden = !won || stage === 5;
  };
  if (won) showDialogue(closings[stage], showResult);
  else showResult();
}

function update(dt) {
  const activeDash = run.dash > 0;
  const previousSlide = run.slide;
  const previousX = run.x;
  run.x += dt * stages[stage].pace * (activeDash ? 1.25 : 1);
  run.time += dt;
  for (const timer of ['slide','hurt','magnet','dash','platform','land']) run[timer] = Math.max(0, run[timer] - dt);
  run.beats = run.beats.filter(time => time > run.time - .23);
  if (run.cat && previousSlide && !run.slide) jump(390);
  if (run.standing && (run.x >= run.standing.x+run.standing.width || !lit(run.standing))) {
    run.standing = null;
    run.jumps = 1;
  }
  const gap = stage === 0 && run.items.find(item => item.kind === 'gap'
    && run.x >= item.x && run.x < item.x+item.width);
  if (gap && run.height <= 0 && run.vy <= 0) {
    run.hp--;
    if (!run.hp) { end(false); return; }
    run.x = gap.x+gap.width+12;
    run.height = run.vy = run.jumps = 0;
    run.slide = 0;
    run.hurt = 1;
  }
  if (!run.standing && (run.height > 0 || run.vy > 0)) {
    const oldHeight = run.height;
    run.height += run.vy * dt;
    run.vy -= 1150 * dt;
    if (stage <= 1 && run.vy <= 0) {
      const landing = run.items.find(item => item.kind === 'ledge' && lit(item)
        && run.x >= item.x && run.x < item.x+item.width
        && oldHeight >= item.height && run.height <= item.height);
      if (landing) {
        run.standing = landing;
        run.height = landing.height;
        run.vy = run.jumps = 0;
        run.land = .12;
      }
    }
    if (run.height <= 0) {
      run.height = run.vy = run.jumps = 0;
      run.land = .12;
    }
  }
  for (const item of run.items) {
    const distance = item.x - run.x;
    if (item.kind === 'ledge' || item.kind === 'gap' || item.done || distance > 125 || distance < -32) continue;
    if (item.kind === 'checkpoint' && previousX < item.x && run.x >= item.x) {
      item.done = true;
      checkpoint = {x:item.x,hearts:run.hearts,energy:run.energy,bonus:run.bonus};
    } else if (item.kind === 'fork' && previousX < item.x && run.x >= item.x) {
      item.done = true;
      run.route = run.height >= 54 ? 'upper' : 'lower';
      const upper = run.route === 'upper';
      for (const token of run.items) {
        if (token.x < 7350 || token.x > 10800) continue;
        if (token.kind === 'heart') token.height = upper ? Math.min(175,token.height+38) : Math.max(18,token.height-15);
        if (upper && ['box','sign'].includes(token.kind)) token.kind = token.kind === 'box' ? 'sign' : 'box';
      }
    } else if (item.kind === 'evidence' && Math.abs(distance) < 26 && run.height < 54) {
      item.done = true;
      run.evidence++;
    } else if (item.kind === 'bonus' && Math.abs(distance) < 23
      && Math.abs(item.height-run.height-35) < 24) {
      item.done = true;
      run.bonus++;
      run.hearts += 5;
      run.energy = Math.min(8, run.energy+2);
    } else if (item.kind === 'heart') {
      const center = run.height + (run.slide ? 17 : 40);
      if ((Math.abs(distance) < 23 && Math.abs(item.height - center) < 31) || (run.magnet && distance < 125)) {
        item.done = true;
        run.hearts++;
        run.energy = Math.min(8, run.energy + 1);
      }
    } else if (item.kind === 'pad' && previousX < item.x && run.x >= item.x && run.height < 18) {
      item.done = true;
      run.magnet = Math.max(run.magnet, 2.3);
    } else if (['box','sign'].includes(obstacleKind(item.kind)) && Math.abs(distance) < 23) {
      const bottom = run.height;
      const top = bottom + (run.slide ? 69 : 99);
      const collision = obstacleKind(item.kind) === 'box' ? bottom < 40 : top > 74 && bottom < 109;
      if (!collision) continue;
      if (run.dash) {
        item.done = true;
        run.dash = 0;
      } else if (!run.hurt) {
        item.done = true;
        run.hp--;
        run.combo = 0;
        run.hurt = 1;
        if (!run.hp) { end(false); return; }
      }
    }
  }
  if (stage === 3) {
    for (const item of run.items) {
      if (item.x < run.x-30 && !item.danced && !item.missed && ['box','sign'].includes(item.kind)) {
        item.missed = true;
        run.combo = 0;
      }
    }
  }
  if (run.x >= finish) end(stage !== 5);
}

function rect(x,y,w,h,color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

// Pixel offsets for the two legs, body lean, and body height in each action.
const costumePoses = [
  {stride:14, leftLift:0, rightLift:8, lean:.10, height:1},
  {stride:5, leftLift:0, rightLift:15, lean:.12, height:.97},
  {stride:-14, leftLift:8, rightLift:0, lean:.10, height:1},
  {stride:-5, leftLift:15, rightLift:0, lean:.12, height:.97},
  {stride:12, leftLift:4, rightLift:18, lean:.20, height:1},
  {stride:-12, leftLift:19, rightLift:8, lean:-.16, height:.97},
  {stride:6, leftLift:0, rightLift:0, lean:.18, height:.87},
  {stride:0, leftLift:0, rightLift:0, lean:1.02, height:.73},
];

function drawCostumePose(sprite, width, poseIndex) {
  const pose = costumePoses[poseIndex];
  const sourceWidth = sprite.naturalWidth;
  const sourceHeight = sprite.naturalHeight;
  const height = Math.round(spriteHeight * pose.height);
  const left = -Math.round(width / 2);
  if (poseIndex === 7) {
    // Put the trailing foot behind the runner while the head stays below signs.
    ctx.translate(-38, -6);
    ctx.rotate(pose.lean);
    ctx.drawImage(sprite, left, -height, width, height);
    return;
  }

  ctx.rotate(pose.lean);
  // Keep the face and outfit intact, and flex the legs below the hips.
  const hips = Math.round(sourceHeight * .65);
  const upperHeight = Math.round(height * hips / sourceHeight);
  ctx.drawImage(sprite, 0, 0, sourceWidth, hips, left, -height, width, upperHeight);
  const middle = Math.round(sourceWidth / 2);
  const halfWidth = Math.round(width * middle / sourceWidth);
  const legLength = height - upperHeight;
  const legRows = sourceHeight - hips;
  const stripCount = Math.min(12, legRows);
  for (let leg = 0; leg < 2; leg++) {
    const offset = leg === 0 ? 0 : middle;
    const sourceLegWidth = leg === 0 ? middle : sourceWidth - middle;
    const destinationX = left + (leg === 0 ? 0 : halfWidth);
    const destinationWidth = leg === 0 ? halfWidth : width - halfWidth;
    const length = legLength - (leg === 0 ? pose.leftLift : pose.rightLift);
    const stride = leg === 0 ? -pose.stride : pose.stride;
    for (let strip = 0; strip < stripCount; strip++) {
      const from = strip / stripCount;
      const to = (strip + 1) / stripCount;
      const sourceY = Math.round(legRows * from);
      const sourceEnd = Math.round(legRows * to);
      const y = Math.round(length * from);
      const end = Math.round(length * to);
      if (end > y) {
        ctx.drawImage(sprite, offset, hips + sourceY, sourceLegWidth, sourceEnd - sourceY,
          destinationX + Math.round(stride * from * from), -legLength + y, destinationWidth, end - y);
      }
    }
  }
}

function drawRescue() {
  const approach = Math.max(0, Math.min(1, (rescueTime - .55) / 1.55));
  const reunited = approach === 1;
  const reunionFloor = 317;
  rect(0,0,720,438,'#332448');
  rect(0,reunionFloor,720,121,'#292039');
  rect(0,reunionFloor,720,3,'#eab4d9');
  drawRescueArch(570,reunionFloor,Math.min(1,rescueTime / .65));
  const heights = [132,126,120,118,116];
  members.forEach(([id], index) => {
    const {idle,skins} = sprites.get(id);
    const portrait = skins[5] || idle;
    if (!portrait.complete || !portrait.naturalWidth) return;
    const height = heights[index];
    const width = Math.round(portrait.naturalWidth*height/portrait.naturalHeight);
    const target = 190 + index*82;
    const x = id === 'moka' ? 570 + (target-570)*approach : target;
    const step = id === 'moka' && approach > 0 && !reunited
      ? Math.round(Math.abs(Math.sin(rescueTime*21))*6) : 0;
    ctx.drawImage(portrait,Math.round(x-width/2),reunionFloor-height-step,width,height);
  });
  if (reunited) {
    for (let index=0; index<9; index++) {
      const rise = Math.min(46,(rescueTime-2.1)*55);
      rect(168+index*48,reunionFloor-153-(index%3)*10-rise,4,4,'#ffe4a5');
    }
  }
}

function drawRescueArch(x, bottom, opening = 0) {
  rect(x-49,bottom-164,98,164,'#8661a0');
  rect(x-39,bottom-151,78,151,'#36264c');
  const gateWidth = Math.round(39*(1-opening));
  rect(x-39,bottom-151,gateWidth,151,'#50335f');
  rect(x+39-gateWidth,bottom-151,gateWidth,151,'#50335f');
  for (const offset of [-24,0,24]) rect(x+offset-2,bottom-161,4,4,'#ffdba0');
}

function draw() {
  if (stage === 5 && (mode === 'rescue' || mode === 'clear')) {
    drawRescue();
    return;
  }
  const sky = ctx.createLinearGradient(0,0,0,floor);
  const lateMagnetic = stage === 0 && run.x >= checkpointMarkers[1];
  const [skyTop,skyBottom,building,ground] = lateMagnetic
    ? ['#262044','#a0659b','#463666','#2c2648'] : stages[stage].palette;
  sky.addColorStop(0,skyTop);
  sky.addColorStop(1,skyBottom);
  rect(0,0,720,438,sky);
  ctx.fillStyle = '#ffedbd';
  ctx.beginPath();
  ctx.arc(558,68,31,0,Math.PI*2);
  ctx.fill();
  if (stage) {
    for (let i=0;i<36;i++) rect((i*83+17)%720, (i*41+9)%138, 2, 2, '#d9e7fc');
  }
  for (let i=0;i<13;i++) {
    const offset = (run.x*.16)%74;
    const x = i*74-offset;
    const height = 52+((i+Math.floor(run.x*.16/74))*47)%92;
    rect(x,floor-height,64,height,building);
    for (let y=floor-height+11;y<floor-8;y+=18) rect(x+13,y,12,7,'#d2a4bf');
  }
  rect(0,floor,720,60,ground);
  rect(0,floor,720,4,'#ffe0ce');
  for (let i=0;i<15;i++) rect(i*52-run.x%52,floor+21,30,3,'#76688b');
  const gateX = playerX + rescueGate - run.x;
  if (stage === 5 && gateX > -60 && gateX < 780) drawRescueArch(gateX,floor);
  for (const item of run.items) {
    const x = playerX + item.x - run.x;
    if (item.done || x+(item.width || 35) < 0 || x > 755) continue;
    if (item.kind === 'gap') {
      rect(x,floor,item.width,60,'#17152a');
      rect(x-4,floor,4,15,'#ffca9e');
      rect(x+item.width,floor,4,15,'#ffca9e');
    } else if (item.kind === 'bonus') {
      ctx.fillStyle='#fff5a8'; ctx.font='bold 22px system-ui';
      ctx.fillText('✦',x-9,floor-item.height+5);
    } else if (item.kind === 'ledge') {
      const y = floor-item.height;
      const visible = lit(item);
      rect(x,y,item.width,visible ? 7 : 2,visible ? (stage === 0 ? '#ffc4e7' : '#bdf4ff') : '#827dad');
      if (visible) rect(x,y+6,item.width,4,'#748dd7');
    } else if (item.kind === 'checkpoint') {
      rect(x-2,floor-135,4,135,'#a7fce8');
      rect(x,floor-135,76,30,'#2f6874');
      ctx.fillStyle='#e2fff1'; ctx.font='bold 13px system-ui';
      ctx.fillText('체크포인트',x+5,floor-115);
    } else if (item.kind === 'fork' || item.kind === 'evidence') {
      const y = floor-item.height;
      rect(x-8,y-8,16,16,item.kind === 'fork' ? '#f8a9ce' : '#fff4df');
      ctx.fillStyle='#633c6a'; ctx.font='bold 13px system-ui';
      ctx.fillText(item.kind === 'fork' ? '♥' : '✦',x-5,y+5);
    } else if (obstacleKind(item.kind) === 'box') {
      rect(x-15,floor-40,30,40,'#924766');
      rect(x-11,floor-35,22,4,'#ffb8c7');
    } else if (obstacleKind(item.kind) === 'sign') {
      rect(x-14,floor-109,28,35,'#5e396e');
      rect(x-11,floor-105,22,3,'#ffcfe0');
      rect(x-9,floor-82,18,3,'#e4a4cc');
    } else if (item.kind === 'pad') {
      rect(x-19,floor-7,38,7,'#a3fff0');
      rect(x-14,floor-11,28,4,'#4ccbbf');
    } else {
      ctx.font = 'bold 19px system-ui';
      ctx.fillStyle = '#fff0ae';
      ctx.fillText('♥', x-9, floor-item.height+5);
    }
  }
  const goalX = playerX + finish - run.x;
  if (goalX < 750) {
    rect(goalX-2, floor-106, 4,106,'#fff4d6');
    rect(goalX, floor-106,44,30,'#dc6aa5');
    ctx.fillStyle='#fff4ed'; ctx.font='bold 14px system-ui'; ctx.fillText('단서',goalX+7,floor-86);
  }
  const {idle, poses, skins} = sprites.get(selected[0]);
  const poseIndex = run.slide ? 7 : run.height && !run.standing ? (run.jumps > 1 ? 5 : 4)
    : run.land ? 6 : mode === 'playing' ? Math.floor(run.time*12)%4 : -1;
  const pose = stage < 2 ? poses[poseIndex] : null;
  const animateCostume = stage >= 2 && poseIndex >= 0;
  const hasPose = pose?.complete && pose.naturalWidth > 0;
  const sprite = hasPose ? pose : skins[stage] || idle;
  const feet = Math.max(spriteHeight + 6, floor - run.height);
  if (run.platform) rect(playerX-22, feet+6,44,3,'#d4ecff');
  if (run.magnet || run.dash) {
    ctx.strokeStyle = run.magnet ? '#a3fff0' : '#ffd99a';
    ctx.beginPath(); ctx.arc(playerX,feet-34,40,0,Math.PI*2); ctx.stroke();
  }
  if (sprite.complete && sprite.naturalWidth) {
    const height = hasPose ? Math.round(sprite.naturalHeight * spriteHeight / motionHeight) : run.slide ? 68 : spriteHeight;
    const width = Math.round(sprite.naturalWidth * (hasPose ? spriteHeight / motionHeight : spriteHeight / sprite.naturalHeight));
    const gait = !hasPose && !animateCostume && mode === 'playing' && !run.height && !run.slide ? Math.sin(run.time*27) : 0;
    ctx.save();
    ctx.translate(playerX, Math.round(feet-Math.abs(gait)*3));
    ctx.rotate(gait*.055);
    if (stage === 1) {
      const twinkle = Math.sin(run.time * 4) * 4;
      rect(-width/2-9, -height*.66+twinkle, 3, 9, '#ffedc0');
      rect(-width/2-12, -height*.66+3+twinkle, 9, 3, '#ffedc0');
      rect(width/2+8, -height*.86-twinkle, 3, 3, '#f6deff');
      ctx.filter = moonlight;
    }
    if (run.hurt && Math.floor(run.hurt*12)%2) ctx.globalAlpha = .35;
    if (animateCostume) drawCostumePose(sprite, width, poseIndex);
    else ctx.drawImage(sprite, -Math.round(width/2), -height, width, height);
    ctx.restore();
  }
  if (run.beats.some(time => Math.abs(time-run.time) < .23)) {
    ctx.strokeStyle = '#ffd46f';
    ctx.beginPath(); ctx.arc(playerX,feet-46,43,0,Math.PI*2); ctx.stroke();
  }
  if (mode === 'clear' || mode === 'lost' || mode === 'paused') {
    rect(210,96,300,73,'#261f41');
    ctx.fillStyle='#fff1d6'; ctx.font='bold 24px system-ui'; ctx.textAlign='center';
    ctx.fillText({clear:stage === 5 ? '✦ 모카 구출 성공!' : '✦ 단서 발견!',lost:'다시 도전!',paused:'일시정지'}[mode],360,141);
    ctx.textAlign='left';
  }

}

// Original eight-beat loops, voiced separately for each stage.
const scores = [
  {bpm:116, voice:'triangle', lead:[76,0,79,81,79,76,0,72,74,0,77,79,77,74,72,0], bass:[48,48,45,43]},
  {bpm:82, voice:'sine', lead:[72,76,79,0,81,79,76,0,71,74,77,0,79,77,74,0], bass:[48,45,43,43]},
  {bpm:100, voice:'triangle', lead:[69,72,76,74,72,0,67,69,74,77,81,77,76,72,0,67], bass:[45,48,50,43]},
  {bpm:126, voice:'square', lead:[72,0,72,75,0,77,75,0,70,0,70,74,0,77,74,0], bass:[48,48,46,43]},
  {bpm:109, voice:'triangle', lead:[64,0,67,0,70,67,0,64,62,0,65,0,69,65,0,62], bass:[40,43,38,41]},
  {bpm:132, voice:'triangle', lead:[69,69,0,72,74,0,72,76,77,76,0,74,72,0,71,67], bass:[45,45,41,43]},
];
let audioContext;
let musicGain;
let musicEnabled = true;
let musicStage = -1;
let nextNote = 0;
let musicStep = 0;

function startMusic() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!musicEnabled || !Audio) return;
  if (!audioContext) {
    audioContext = new Audio();
    musicGain = audioContext.createGain();
    musicGain.gain.value = .23;
    musicGain.connect(audioContext.destination);
  }
  if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
}

function musicNote(pitch, voice, time, duration, level) {
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  oscillator.type = voice;
  oscillator.frequency.value = 440 * 2 ** ((pitch - 69)/12);
  envelope.gain.setValueAtTime(.0001,time);
  envelope.gain.exponentialRampToValueAtTime(level,time+.012);
  envelope.gain.exponentialRampToValueAtTime(.0001,time+duration);
  oscillator.connect(envelope);
  envelope.connect(musicGain);
  oscillator.start(time);
  oscillator.stop(time+duration+.02);
  oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
}

function updateMusic() {
  if (!audioContext || audioContext.state !== 'running') return;
  const now = audioContext.currentTime;
  const active = musicEnabled && !document.hidden && !get('play').hidden && mode !== 'paused';
  const level = !active ? 0 : mode === 'playing' ? .27 : .13;
  musicGain.gain.setTargetAtTime(level,now,.025);
  if (!active) return;
  const score = scores[stage];
  const beat = 30 / score.bpm;
  if (musicStage !== stage) {
    musicStage = stage;
    musicStep = 0;
    nextNote = now + .035;
  } else if (nextNote < now) nextNote = now + .035;
  while (nextNote < now+.12) {
    const pitch = score.lead[musicStep];
    if (pitch) musicNote(pitch,score.voice,nextNote,beat*.85,score.voice === 'square' ? .13 : .24);
    if (musicStep % 4 === 0) musicNote(score.bass[musicStep/4],'sine',nextNote,beat*2.7,.36);
    if (score.bpm >= 109 && musicStep % 2 === 0) musicNote(32,'sine',nextNote,.085,.26);
    musicStep = (musicStep+1) % score.lead.length;
    nextNote += beat;
  }
}

get('music').addEventListener('click', () => {
  musicEnabled = !musicEnabled;
  get('music').textContent = musicEnabled ? 'BGM 켜짐' : 'BGM 꺼짐';
  get('music').setAttribute('aria-pressed',String(musicEnabled));
  if (musicEnabled) startMusic();
  updateMusic();
});

let last = 0;
function frame(now) {
  const dt = last ? Math.min((now-last)/1000, .033) : 0;
  last = now;
  if (mode === 'playing') update(dt);
  if (mode === 'rescue') {
    rescueTime = Math.min(rescueDuration, rescueTime + dt);
    if (rescueTime === rescueDuration) end(true);
  }
  updateMusic();
  get('hearts').textContent = '하트 ' + run.hearts;
  get('energy').textContent = '특수기 ' + run.energy + '/8';
  get('life').textContent = '체력 ' + run.hp;
  const objective = stage === 5 ? '증거 ' + run.evidence + '/3' : stage === 3 ? '콤보 ' + run.combo : stage === 0 ? '보너스 별 ' + run.bonus : '';
  if (get('objective').textContent !== objective) get('objective').textContent = objective;
  get('whistle').disabled = mode !== 'playing';
  get('progress').textContent = Math.min(100, Math.floor(run.x/finish*100)) + '%';
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
